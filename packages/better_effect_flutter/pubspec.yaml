name: better_effect_flutter
description: Flutter MVVM integration for better_effect with typed EffectCommand state, scoped Runtime bootstrap, and one-shot UI listeners.
version: 0.1.1
repository: https://github.com/nitoba/better-effect-dart
issue_tracker: https://github.com/nitoba/better-effect-dart/issues
documentation: https://github.com/nitoba/better-effect-dart/tree/main/packages/better_effect_flutter/doc
topics:
  - flutter
  - mvvm
  - dependency-injection
  - state-management
  - effects

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  better_effect: ^0.1.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
