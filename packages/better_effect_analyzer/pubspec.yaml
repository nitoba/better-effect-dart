name: better_effect_analyzer
description: >-
  Static analysis and whole-project Module graph validation for better_effect
  and better_effect_flutter.
version: 0.4.0
repository: https://github.com/nitoba/better-effect-dart
issue_tracker: https://github.com/nitoba/better-effect-dart/issues
documentation: https://github.com/nitoba/better-effect-dart/tree/main/packages/better_effect_analyzer/doc

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  analysis_server_plugin: '>=0.3.14 <0.3.18'
  analyzer: ^12.1.0
  analyzer_plugin: ^0.14.8
  args: ^2.7.0
  path: ^1.9.1

dev_dependencies:
  analyzer_testing: 0.2.5
  lints: ^6.1.0
  test: 1.31.1
  test_reflective_loader: ^0.4.0

executables:
  better_effect_analyzer: better_effect_analyzer

topics:
  - analysis
  - dependency-injection
  - flutter
  - lints
  - mvvm
