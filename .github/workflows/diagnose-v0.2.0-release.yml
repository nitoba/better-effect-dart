name: Diagnose v0.2.0 release

on:
  push:
    branches:
      - release/verify-v0.2.0

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: release/verify-v0.2.0

      - name: Capture Actions metadata
        run: |
          {
            echo '{'
            echo '  "workflows": '
            gh workflow list \
              --repo nitoba/better-effect-dart \
              --all \
              --json id,name,path,state \
              | jq '.'
            echo '  ,"runs": '
            gh run list \
              --repo nitoba/better-effect-dart \
              --limit 100 \
              --json databaseId,name,workflowName,status,conclusion,headBranch,event,url,createdAt,updatedAt \
              | jq '.'
            echo '}'
          } > .release-v0.2.0-diagnostic.json

      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-v0.2.0-diagnostic.json
          git commit -m "chore(release): diagnose v0.2.0 workflows"
          git push origin HEAD:release/verify-v0.2.0
