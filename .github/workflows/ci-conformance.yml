name: CI semantic conformance

on:
  push:
    branches: [main]
    paths:
      - 'SEMANTICS.md'
      - 'docs/semantic-migrations.md'
      - 'packages/better_effect/**'
      - 'packages/better_effect_flutter/**'
      - 'packages/better_effect_conformance/**'
      - '.github/workflows/ci-conformance.yml'
  pull_request:
    paths:
      - 'SEMANTICS.md'
      - 'docs/semantic-migrations.md'
      - 'packages/better_effect/**'
      - 'packages/better_effect_flutter/**'
      - 'packages/better_effect_conformance/**'
      - '.github/workflows/ci-conformance.yml'

concurrency:
  group: semantic-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/better_effect_conformance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze conformance package
        run: flutter analyze --fatal-infos

      - name: Run semantic conformance suite
        run: flutter test --reporter expanded
