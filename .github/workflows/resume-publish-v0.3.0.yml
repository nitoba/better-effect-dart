name: Finish publishable v0.3.0 packages

on:
  push:
    branches:
      - automation/resume-publish-v0.3.0

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.3.0
      MAIN_SHA: 4d09d95114b7f02160e0cb337ba5df923b4b14fd

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0

      - name: Publish core and Flutter when missing
        run: |
          set -Eeuo pipefail

          current_package='initialization'
          current_run_id=''

          report_failure() {
            local status=$?
            if [ "$status" -eq 0 ]; then
              return
            fi

            local run_note='No child publication run was discovered.'
            if [ -n "$current_run_id" ]; then
              run_note="Child run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${current_run_id}"
            fi

            gh issue comment 3 \
              --repo "$GITHUB_REPOSITORY" \
              --body "The v0.3.0 publication failed while processing **${current_package}**. ${run_note} The package tags and GitHub Releases were preserved." \
              || true
          }
          trap report_failure ERR

          package_is_visible() {
            local package="$1"
            local payload
            payload="$(curl -fsSL "https://pub.dev/api/packages/${package}")" || return 1
            jq -e --arg version "$VERSION" \
              '.versions | any(.version == $version)' \
              <<<"$payload" >/dev/null
          }

          discover_run() {
            local workflow="$1"
            local tag="$2"
            local since="$3"

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=30" \
              | jq -r \
                  --arg tag "$tag" \
                  --arg sha "$MAIN_SHA" \
                  --arg since "$since" \
                  '[.workflow_runs[]
                    | select(.created_at >= $since)
                    | select(.head_branch == $tag or .head_sha == $sha)]
                   | sort_by(.created_at)
                   | last
                   | .id // empty'
          }

          dispatch_and_wait() {
            local package="$1"
            local workflow="$2"
            local tag="${package}-v${VERSION}"
            local since

            current_package="$package"
            current_run_id=''
            since="$(date -u -d '3 seconds ago' '+%Y-%m-%dT%H:%M:%SZ')"

            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$tag"

            for attempt in $(seq 1 45); do
              current_run_id="$(discover_run "$workflow" "$tag" "$since")"
              if [ -n "$current_run_id" ]; then
                break
              fi
              sleep 2
            done

            test -n "$current_run_id"
            gh run watch "$current_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --exit-status
          }

          wait_for_pubdev() {
            local package="$1"
            current_package="$package"

            for attempt in $(seq 1 90); do
              if package_is_visible "$package"; then
                echo "${package} ${VERSION} is visible on pub.dev."
                return
              fi
              sleep 10
            done
            return 1
          }

          publish_if_missing() {
            local package="$1"
            local workflow="$2"

            if package_is_visible "$package"; then
              echo "${package} ${VERSION} is already published."
              return
            fi

            dispatch_and_wait "$package" "$workflow"
            wait_for_pubdev "$package"
          }

          publish_if_missing better_effect publish-better-effect.yml
          publish_if_missing better_effect_flutter publish-better-effect-flutter.yml

          package_is_visible better_effect
          package_is_visible better_effect_flutter
          trap - ERR

      - name: Record the analyzer publishing blocker
        run: |
          gh issue comment 3 \
            --repo "$GITHUB_REPOSITORY" \
            --body "v0.3.0 release status on August 20, 2026:\n\n- ✅ \`better_effect 0.3.0\` is published on pub.dev.\n- ✅ \`better_effect_flutter 0.3.0\` is published on pub.dev.\n- ⛔ \`better_effect_analyzer 0.3.0\` passed its publish dry-run, but pub.dev rejected the upload because **Publishing from GitHub Actions is not enabled** for that package.\n\nThe analyzer tag and GitHub Release already exist: \`better_effect_analyzer-v0.3.0\`. To complete the release, enable automated publishing in the package Admin tab with repository \`nitoba/better-effect-dart\` and tag pattern \`better_effect_analyzer-v{{version}}\`, then rerun **Publish better_effect_analyzer** at that tag. Milestone v0.3 remains open until this last publication succeeds."

      - name: Delete temporary automation branch
        run: git push origin --delete automation/resume-publish-v0.3.0
