name: Finalize v0.3 milestone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.3-milestone.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close v0.3 milestone
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/milestones/2" \
            -f state=closed \
            -f description='Released on August 20, 2026. All v0.3 implementation issues are complete and better_effect, better_effect_analyzer, and better_effect_flutter 0.3.0 are published.' \
            >/dev/null

      - name: Remove one-shot finalizer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-v0.3-milestone.yml
          git commit -m 'chore(release): remove v0.3 milestone finalizer'
          git push origin HEAD:main
