name: Finalize v0.4 milestone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.4-milestone.yml
  pull_request:
    paths:
      - .github/workflows/finalize-v0.4-milestone.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify milestone is ready
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/milestones/3" \
            --jq '"Milestone: \(.title) | state=\(.state) | open=\(.open_issues) | closed=\(.closed_issues)"'

          open_issues="$(gh api "repos/${GITHUB_REPOSITORY}/milestones/3" --jq '.open_issues')"
          if [ "$open_issues" != "0" ]; then
            echo "Open issues assigned to milestone #3:"
            gh api --method GET "repos/${GITHUB_REPOSITORY}/issues" \
              -f milestone=3 \
              -f state=open \
              -f per_page=100 \
              --jq '.[] | "#\(.number) \(.title)"'
            exit 1
          fi

      - name: Close v0.4 milestone
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/milestones/3" \
            -f state=closed \
            -f description='Implementation completed on August 21, 2026. Issues #20-#25 and epic #4 are closed. The original #21 standard-services proposal was deliberately narrowed to optional EffectClock/EffectRandom policy services; Logger/Config were not shipped as v0.4 contracts. Package versioning/publication is tracked separately from this implementation milestone.' \
            >/dev/null

      - name: Remove one-shot finalizer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-v0.4-milestone.yml
          git commit -m 'chore(release): remove v0.4 milestone finalizer'
          git push origin HEAD:main
